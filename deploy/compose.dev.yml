# Local development: Postgres only.
#   docker compose -f deploy/compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: ${AG_DB_USER:-agentguard}
      POSTGRES_PASSWORD: ${AG_DB_PASSWORD:-agentguard}
    ports:
      - "5432:5432"
    volumes:
      - agentguard-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentguard-pgdata-dev:
