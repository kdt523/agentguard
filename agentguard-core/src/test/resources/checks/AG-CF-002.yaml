check: AG-CF-002
cases:
  - name: github token
    expectFinding: true
    tool: { name: t, description: "x" }
    config: { command: node, env: { GITHUB_TOKEN: "ghp_abcdefghijklmnopqrstuvwxyz0123456789" } }
  - name: aws access key
    expectFinding: true
    tool: { name: t, description: "x" }
    config: { command: node, env: { AWS_ACCESS_KEY_ID: "AKIA1111111111111111" } }
  - name: openai style key
    expectFinding: true
    tool: { name: t, description: "x" }
    config: { command: node, env: { OPENAI: "sk-abcdefghijklmnopqrstuvwx" } }
  - name: secret by variable name
    expectFinding: true
    tool: { name: t, description: "x" }
    config: { command: node, env: { API_KEY: "abcdef123456XYZ" } }
  - name: variable reference
    expectFinding: false
    tool: { name: t, description: "x" }
    config: { command: node, env: { GITHUB_TOKEN: "${GITHUB_TOKEN}" } }
  - name: harmless settings
    expectFinding: false
    tool: { name: t, description: "x" }
    config: { command: node, env: { LOG_LEVEL: debug, PORT: "8080" } }
  - name: no env
    expectFinding: false
    tool: { name: t, description: "x" }
    config: { command: node }
  - name: short placeholder secret
    expectFinding: false
    tool: { name: t, description: "x" }
    config: { command: node, env: { PASSWORD: "changeme" } }
